name: Build Muallemi AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: |
          mkdir -p project
          unzip -o muallemi_ai_flutter_project.zip -d project

          echo "Searching for pubspec.yaml..."
          PUBSPEC=$(find project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muallemi-ai-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
